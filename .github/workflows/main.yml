name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 页面手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归检出主仓库代码及所有依赖子模块
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 通过 SDK 管理器在云端自动下载配置 Android NDK r25c
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 3. 精准进入主项目目录，并利用管道符自动应对交互式菜单
      - name: Compile Main AndUEDumper
        run: |
          # 检查当前最外层目录结构
          ls -la
          
          # 尝试进入 AndUEDumper 主源码目录
          if [ -d "AndUEDumper" ]; then
              cd AndUEDumper
          fi
          
          echo "[+] 当前编译工作目录: $(pwd)"
          
          if [ -f "build.sh" ]; then
              echo "[+] 成功找到主构建脚本，开始自动选择 CMake 编译..."
              chmod +x build.sh
              
              # 【核心逻辑】：通过 echo "1" 自动应答交互式菜单中的 [1] CMake 选项
              echo "1" | ./build.sh
              
          elif [ -f "AndUEDumper/build.sh" ]; then
              echo "[+] 在子目录中找到 build.sh，开始自动选择 CMake 编译..."
              cd AndUEDumper
              chmod +x build.sh
              
              # 同上，自动应答 [1] CMake
              echo "1" | ./build.sh
          else
              echo "[-] 错误：在此路径下未找到主程序的 build.sh 脚本！"
              ls -R
              exit 1
          fi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      # 4. 收集全盘可能生成的二进制产物并打包上传
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Final-Binaries
          path: |
            **/out/
            **/libs/
            **/build/
            **/bin/
          if-no-files-found: warn
