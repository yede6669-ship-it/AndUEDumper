name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归检出代码及所有子模块
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装必要构建工具（补全 Ninja 和 Make）
      - name: Install Build Tools (Ninja & Make)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build make build-essential

      # 3. 通过 SDK 管理器自动下载 NDK r25c
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 4. 修复脚本硬编码、重设可执行权限并自动编译
      - name: Compile Main AndUEDumper
        run: |
          # 尝试进入 AndUEDumper 主源码目录
          if [ -d "AndUEDumper" ]; then
              cd AndUEDumper
          fi
          
          echo "[+] 当前编译工作目录: $(pwd)"
          
          # 【核心修复 1】：改用纯 Linux 环境变量拼接，确保拿到绝对完整的系统路径
          export REAL_NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          echo "[+] NDK 绝对路径精准定为: $REAL_NDK_PATH"
          
          if [ -f "build.sh" ]; then
              # 【核心修复 2】：动态修正脚本内部路径拼接
              sed -i "s|\$NDK_HOME|$REAL_NDK_PATH|g" build.sh
              sed -i "s|/ndk/25.2.9519653|$REAL_NDK_PATH|g" build.sh
              
              # 【核心修复 3】：不管前面发生了什么，在运行前强制重新赋予最高可执行权限
              chmod 775 build.sh
              
              echo "[+] 脚本修复与权限刷新完毕，开始自动选择 CMake 编译..."
              echo "1" | ./build.sh
          else
              echo "[-] 错误：未找到 build.sh 脚本！"
              exit 1
          fi
        env:
          # 为全局编译链环境做好变量铺垫
          NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653

      # 5. 打包并上传编译生成的产物
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Final-Binaries
          path: |
            **/out/
            **/libs/
            **/build/
            **/bin/
          if-no-files-found: warn
