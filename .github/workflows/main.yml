name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归检出代码及子模块
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 通过 SDK 管理器自动下载 NDK
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 3. 赋予脚本执行权限并调用 build.sh 编译
      # 同样把 NDK 路径映射给项目需要用的 NDK_HOME 变量
      - name: Compile with build.sh
        run: |
          # 寻找 build.sh 所在的目录并进入
          SCRIPT_DIR=$(find . -name "build.sh" -exec dirname {} \;)
          if [ -n "$SCRIPT_DIR" ]; then
              echo "[+] 找到 build.sh 位于: $SCRIPT_DIR"
              cd "$SCRIPT_DIR"
          else
              echo "[-] 错误：整个仓库中都没有找到 build.sh！"
              exit 1
          fi
          
          # 给脚本加可执行权限并运行
          chmod +x build.sh
          ./build.sh
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      # 4. 上传产物
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Artifacts
          path: |
            **/out/
            **/libs/
            **/build/
          if-no-files-found: warn
