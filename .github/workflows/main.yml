name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归检出代码及所有子模块（非常重要，漏了底层库会报错）
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 通过 SDK 管理器自动下载 NDK r25c
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 3. 直接进入主程序目录进行编译（不走 find 盲搜，100% 精准）
      - name: Compile Main AndUEDumper
        run: |
          # 检查当前最外层目录结构
          ls -la
          
          # 直接尝试进入 AndUEDumper 主目录
          # （注：如果你的仓库根目录直接就是源码，没有 AndUEDumper 这一层文件夹，它会自动留在根目录）
          if [ -d "AndUEDumper" ]; then
              cd AndUEDumper
          fi
          
          echo "[+] 当前编译工作目录: $(pwd)"
          
          if [ -f "build.sh" ]; then
              echo "[+] 成功找到主构建脚本，开始编译..."
              chmod +x build.sh
              ./build.sh
          elif [ -f "AndUEDumper/build.sh" ]; then
              echo "[+] 在子目录中找到 build.sh，开始编译..."
              cd AndUEDumper
              chmod +x build.sh
              ./build.sh
          else
              echo "[-] 错误：在此路径下未找到主程序的 build.sh 脚本！"
              ls -R
              exit 1
          fi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      # 4. 收集并上传编译生成的产物
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Final-Binaries
          path: |
            **/out/
            **/libs/
            **/build/
          if-no-files-found: warn
