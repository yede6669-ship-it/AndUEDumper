name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归检出代码及所有子模块
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装必要构建工具（补全 Ninja 和 Make）
      - name: Install Build Tools (Ninja & Make)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build make build-essential

      # 3. 通过 SDK 管理器自动下载 NDK r25c
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 4. 修复脚本硬编码、抹除严苛警告、修正 C++20 语法漏洞并编译
      - name: Compile Main AndUEDumper
        run: |
          # 尝试进入 AndUEDumper 主源码目录
          if [ -d "AndUEDumper" ]; then
              cd AndUEDumper
          fi
          
          echo "[+] 当前编译工作目录: $(pwd)"
          
          export REAL_NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          
          if [ -f "build.sh" ]; then
              # 核心修复 1：修正 NDK_HOME 路径
              sed -i "s|\$NDK_HOME|$REAL_NDK_PATH|g" build.sh
              sed -i "s|/ndk/25.2.9519653|$REAL_NDK_PATH|g" build.sh
              
              # 核心修复 2：在 CMakeLists.txt 中无视所有阻碍编译的 -Werror 警告
              if [ -f "CMakeLists.txt" ]; then
                  echo "[+] 检测到 CMakeLists.txt，正在移除 -Werror 限制..."
                  sed -i 's/-Werror//g' CMakeLists.txt
              fi
              
              # 核心修复 3：修正 Dumper.cpp 中第 302 行的 C++20 运算符重载歧义
              if [ -f "src/Dumper.cpp" ]; then
                  echo "[+] 正在修正 src/Dumper.cpp 中的 C++20 符号歧义..."
                  sed -i 's/pkg.first == packageObj/pkg.first == (unsigned char *)packageObj.object/g' src/Dumper.cpp
              fi

              # 刷新执行权限
              chmod 775 build.sh
              
              echo "[+] 源码与权限深度修复完毕，开始自动选择 CMake 编译..."
              echo "1" | ./build.sh
          else
              echo "[-] 错误：未找到 build.sh 脚本！"
              exit 1
          fi
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653

      # 5. 打包并上传编译生成的产物
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Final-Binaries
          path: |
            **/out/
            **/libs/
            **/build/
            **/bin/
          if-no-files-found: warn
