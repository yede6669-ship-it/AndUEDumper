name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归检出代码及子模块
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装 Make 等必备构建工具
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential

      # 3. 通过 SDK 管理器自动下载 NDK 
      # GitHub Actions 的 Ubuntu 镜像自带了 sdkmanager。我们直接用它下载 r25c 版本的 NDK（版本号为 25.2.9519653）
      # 这也是官方最提倡的、不会报任何输入项错误的纯净做法
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 4. 执行自动化编译
      # 此时 NDK 会被下载到 $ANDROID_HOME/ndk/25.2.9519653 目录下
      # 我们直接把它赋值给该项目 Makefile 苦苦寻找的 NDK_HOME 变量
      - name: Compile AndUEDumper
        run: |
          cd AndUEDumper
          make clean && make
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      # 5. 上传产物
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Artifacts
          path: |
            AndUEDumper/AndUEDumper
            AndUEDumper/out/
            AndUEDumper/libs/
          if-no-files-found: warn
