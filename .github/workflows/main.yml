name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动在 GitHub 页面点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出主仓库代码，并递归下载所有子模块（对应 git clone --recursive）
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装编译所需的 Make 和基础工具
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential

      # 3. 设置并配置 Android NDK (推荐使用与项目相近的 r25c 版本，确保稳定)
      - name: Setup Android NDK
        id: setup-ndk
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653' # 如果想用特定的旧版本（如 r21e），可以换成 '21.4.7075529'

      # 4. 执行自动化编译
      # 根据指南进入子目录，通过 env 将 GitHub 虚拟环境的 $ANDROID_NDK_ROOT 赋值给该项目所需的 NDK_HOME
      - name: Compile AndUEDumper
        run: |
          cd AndUEDumper
          make clean && make
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # 5. 收集并上传编译生成的产物
      # 该项目编译完成后，通常会在 AndUEDumper 目录或其 out/libs 下生成二进制文件
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Artifacts
          path: |
            AndUEDumper/AndUEDumper
            AndUEDumper/out/
            AndUEDumper/libs/
          if-no-files-found: warn # 避免因输出目录名字不固定导致构建报红
