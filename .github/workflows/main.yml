name: Build AndUEDumper

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 递归检出代码及所有子模块
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装必要构建工具（补全 Ninja 和 Make）
      - name: Install Build Tools (Ninja & Make)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build make build-essential

      # 3. 通过 SDK 管理器自动下载 NDK r25c
      - name: Install Android NDK via SDKManager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      # 4. 修复脚本硬编码并自动执行编译
      - name: Compile Main AndUEDumper
        run: |
          # 尝试进入 AndUEDumper 主源码目录
          if [ -d "AndUEDumper" ]; then
              cd AndUEDumper
          fi
          
          echo "[+] 当前编译工作目录: $(pwd)"
          
          # 【核心修复 1】：定义绝对路径的 NDK 变量
          export REAL_NDK_PATH="${{ env.ANDROID_HOME }}/ndk/25.2.9519653"
          echo "[+] NDK 绝对路径定为: $REAL_NDK_PATH"
          
          # 【核心修复 2】：动态修正作者 build.sh 内部可能存在的路径拼接漏洞
          # 强行把脚本里可能写成 /ndk/ 的地方，替换为正确的绝对路径环境变量
          if [ -f "build.sh" ]; then
              sed -i 's|\$NDK_HOME|'"$REAL_NDK_PATH"'|g' build.sh
              sed -i 's|/ndk/25.2.9519653|'"$REAL_NDK_PATH"'|g' build.sh
              
              echo "[+] 脚本修复完毕，开始自动选择 CMake 编译..."
              echo "1" | ./build.sh
          else
              echo "[-] 错误：未找到 build.sh 脚本！"
              exit 1
          fi
        env:
          # 保持双保险，同时暴露这两个最常用的 NDK 变量名
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653

      # 5. 打包并上传编译生成的产物
      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AndUEDumper-Final-Binaries
          path: |
            **/out/
            **/libs/
            **/build/
            **/bin/
          if-no-files-found: warn
